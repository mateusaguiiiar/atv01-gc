<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Procurar Planeta</title>

    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
</head>

<body>

    <div class="container py-5">

        <h1 class="mb-2">Procurar Planeta</h1>

        <p class="text-body-secondary mb-4">
            Consulte as informações de um planeta.
        </p>

        <form class="mb-5">

            <div class="input-group">

                <input
                    type="text"
                    class="form-control"
                    placeholder="Digite o nome do planeta"
                    aria-label="Nome do planeta"
                >

                <button
                    class="btn btn-primary"
                    type="submit"
                >
                    Procurar
                </button>

            </div>

        </form>

        <h2 class="h4 mb-3">Resultado da busca</h2>

        <div class="table-responsive">

            <table class="table table-striped table-bordered">

                <thead class="table-dark">

                    <tr>
                        <th>Nome</th>
                        <th>Número de luas</th>
                        <th>Massa (kg)</th>
                        <th>Possui atmosfera?</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>Terra</td>
                        <td>1</td>
                        <td>5.972 × 10²⁴</td>
                        <td>Sim</td>
                    </tr>

                </tbody>

            </table>

        </div>

        <a href="../index.html" class="btn btn-secondary">
            Voltar
        </a>

    </div>

    <script src="../assets/js/bootstrap.bundle.min.js"></script>

</body>
</html>
