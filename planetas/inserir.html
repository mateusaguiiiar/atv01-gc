<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inserir Planeta</title>

    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
</head>

<body>

    <div class="container py-5">

        <div class="mb-4">
            <h1>Inserir Planeta</h1>
            <p class="text-body-secondary">
                Cadastre um novo planeta no sistema.
            </p>
        </div>

        <form>

            <div class="mb-3">
                <label for="nome" class="form-label">
                    Nome do planeta
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="nome"
                    placeholder="Ex.: Terra"
                >
            </div>

            <div class="mb-3">
                <label for="luas" class="form-label">
                    Número de luas
                </label>

                <input
                    type="number"
                    class="form-control"
                    id="luas"
                    placeholder="Ex.: 1"
                >
            </div>

            <div class="mb-3">
                <label for="massa" class="form-label">
                    Massa (kg)
                </label>

                <input
                    type="number"
                    step="any"
                    class="form-control"
                    id="massa"
                    placeholder="Ex.: 5.972e24"
                >
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Possui atmosfera?
                </label>

                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="radio"
                        name="atmosfera"
                        id="atmosferaSim"
                    >

                    <label class="form-check-label" for="atmosferaSim">
                        Sim
                    </label>
                </div>

                <div class="form-check">
                    <input
                        class="form-check-input"
                        type="radio"
                        name="atmosfera"
                        id="atmosferaNao"
                    >

                    <label class="form-check-label" for="atmosferaNao">
                        Não
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                Cadastrar planeta
            </button>

            <a href="../index.html" class="btn btn-secondary">
                Voltar
            </a>

        </form>

    </div>

    <script src="../assets/js/bootstrap.bundle.min.js"></script>

</body>
</html>
