<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Cometa</title>


<link rel="stylesheet" href="../assets/css/bootstrap.min.css">


</head>

<body>

<div class="container mt-5">


<h1 class="mb-4">Excluir Cometa</h1>

<div class="alert alert-danger" role="alert">
    Atenção: a exclusão de um cometa não poderá ser desfeita.
</div>

<form>

    <div class="mb-3">
        <label for="id" class="form-label">ID do cometa</label>
        <input
            type="number"
            class="form-control"
            id="id"
            name="id"
            min="1"
            placeholder="Digite o ID do cometa"
            required
        >
    </div>

    <div class="mb-3">
        <label for="nome" class="form-label">Nome do cometa</label>
        <input
            type="text"
            class="form-control"
            id="nome"
            name="nome"
            placeholder="Digite o nome para confirmar"
            required
        >
    </div>

    <button type="submit" class="btn btn-danger">
        Excluir
    </button>

    <a href="../index.html" class="btn btn-secondary">
        Voltar
    </a>

</form>


</div>

<script src="../assets/js/bootstrap.bundle.min.js"></script>

</body>
</html>
