<h1 class="mb-4">Procurar Cometa</h1>

<form class="mb-4">

    <div class="input-group">
        <input
            type="text"
            class="form-control"
            placeholder="Digite o nome do cometa"
            aria-label="Nome do cometa"
        >

        <button class="btn btn-primary" type="submit">
            Procurar
        </button>
    </div>

</form>

<div class="table-responsive">

    <table class="table table-striped table-bordered">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Número de aparições</th>
                <th>Diâmetro (km)</th>
                <th>Periódico</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>1</td>
                <td>Halley</td>
                <td>0</td>
                <td>11.0</td>
                <td>Sim</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Hale-Bopp</td>
                <td>0</td>
                <td>60.0</td>
                <td>Não</td>
            </tr>

        </tbody>

    </table>

</div>
